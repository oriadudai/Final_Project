  name: reheartnet

  channels:
    - conda-forge
    - defaults

  dependencies:
    - python=3.12          # required by CLEF (>=3.12)
    - pip>=24.0

    - pip:
      # ── Deep learning ────────────────────────────────────────────────────────
      # CPU-only build (default). To use a GPU replace the two lines below with:
      #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
      # or cu121 / cu124 depending on your CUDA version.
      - ./models/clef_repo
      - torch>=2.0.0

      # ── Signal processing & biosignals ───────────────────────────────────────
      - numpy>=1.26.0
      - scipy>=1.12.0
      - wfdb>=4.1.0             # WFDB format loader for BIDMC
      - neurokit2>=0.2.0        # R-peak detection (Pan-Tompkins)

      # ── Machine learning utilities ───────────────────────────────────────────
      - scikit-learn>=1.3.0     # KFold, linear regression baseline

      # ── Hyperparameter optimisation ──────────────────────────────────────────
      - optuna>=3.0.0
      - plotly>=5.0.0           # Optuna visualisation
      - kaleido>=0.2.0          # Plotly static image export

      # ── Experiment tracking ──────────────────────────────────────────────────
      - wandb>=0.15.0

      # ── Data & visualisation ─────────────────────────────────────────────────
      - pandas>=2.0.0
      - matplotlib>=3.7.0
      - tqdm>=4.65.0

  # ── Manual post-install steps ────────────────────────────────────────────────
  # Run these commands after `conda env create` and `conda activate reheartnet`:
  #
  # 1. Install CLEF from the patched local clone (already in the repo):
  #      pip install models/clef_repo
  #
  # 2. Download the CLEF pretrained checkpoint:
  #      mkdir -p models/clef
  #      curl -L "https://zenodo.org/records/17572734/files/clef_small.ckpt?download=1" \
  #           -o models/clef/clef_small.ckpt
  #
  # 3. (GPU users) Reinstall PyTorch with CUDA support:
  #      pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
  #    Replace cu118 with cu121 or cu124 if you have CUDA 12.x installed.
  #    Run `nvidia-smi` to check your CUDA version.
